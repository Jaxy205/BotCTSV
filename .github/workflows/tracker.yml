
name: Theo Doi CTSV HUIT

on:
  schedule:
    # Sang: 08:03 - 11:23 VN
    - cron: '3-53/10 1-3 * * 1-5'
    - cron: '3-23/10 4 * * 1-5'

    # Chieu: 13:03 - 16:23 VN
    - cron: '3-53/10 6-8 * * 1-5'
    - cron: '3-23/10 9 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctsv-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install-deps chromium
          fi

      - name: Run CTSV Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: "https://www.facebook.com/ctsv.huit"
        run: |
          python bot.py --once

      - name: Save seen posts
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add seen_posts.json

          if git diff --cached --quiet; then
            echo "Khong co thay doi."
          else
            git commit -m "update: seen posts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
