name: Theo Doi CTSV HUIT

on:
  schedule:
    # Thứ 2 đến Thứ 6 (1-5), bỏ Thứ 7 và Chủ Nhật. Nghỉ trưa từ 11h30 đến 13h00.
    # Buổi sáng: 8h00 - 11h30 giờ VN (UTC+7) -> Giờ UTC: 1h00 - 4h30
    - cron: '*/10 1-3 * * 1-5'
    - cron: '0,10,20,30 4 * * 1-5'
    
    # Buổi chiều: 13h00 - 16h30 giờ VN (UTC+7) -> Giờ UTC: 6h00 - 9h30
    - cron: '*/10 6-8 * * 1-5'
    - cron: '0,10,20,30 9 * * 1-5'

  workflow_dispatch: # Cho phép bấm nút "Run workflow" bằng tay trên web GitHub bất cứ lúc nào

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install-deps chromium
          fi

      - name: Run CTSV Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: "https://www.facebook.com/ctsv.huit"
        run: |
          python bot.py --once

      - name: Save seen posts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_posts.json
          git commit -m "update: seen posts" || echo "Không có bài mới, bỏ qua commit"
          git push
