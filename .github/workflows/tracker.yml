name: Theo Doi CTSV HUIT

on:
  schedule:
    # Gio VN: 08:03-11:23 (T2-T6)
    - cron: '3-53/10 1-3 * * 1-5'
    - cron: '3-23/10 4 * * 1-5'

    # Gio VN: 13:03-16:23 (T2-T6)
    - cron: '3-53/10 6-8 * * 1-5'
    - cron: '3-23/10 9 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctsv-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Check Python syntax
        run: |
          python -m py_compile bot.py
          python -c "from pathlib import Path; s=Path('bot.py').read_text(encoding='utf-8'); assert 'asyncio.run(main())' in s; print('Verified bot.py lines:', len(s.splitlines()))"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install chromium --with-deps
          else
            python -m playwright install-deps chromium
          fi

      - name: Run CTSV Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: 'https://www.facebook.com/ctsv.huit'
        run: python bot.py --once

      - name: Upload Facebook screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-debug-${{ github.run_number }}
          path: debug/facebook_page.png
          if-no-files-found: warn
          retention-days: 1

      - name: Save seen posts
        if: always()
        run: |
          if [ ! -f seen_posts.json ]; then
            echo 'No seen_posts.json to save'
            exit 0
          fi

          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'

          git add seen_posts.json

          if ! git diff --cached --quiet; then
            git commit -m 'update: seen posts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
