name: Theo Doi CTSV HUIT

on:
  schedule:
    # Buổi sáng: 08:03–11:23 (Việt Nam)
    - cron: '3-53/10 1-3 * * 1-5'
    - cron: '3-23/10 4 * * 1-5'

    # Buổi chiều: 13:03–16:23 (Việt Nam)
    - cron: '3-53/10 6-8 * * 1-5'
    - cron: '3-23/10 9 * * 1-5'

  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install-deps chromium
          fi

      - name: Run CTSV Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: "https://www.facebook.com/ctsv.huit"
        run: |
          python bot.py --once

      - name: Save seen posts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_posts.json
          git commit -m "update: seen posts" || echo "Không có bài mới, bỏ qua commit"
          git push
